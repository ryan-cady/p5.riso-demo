<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>00 — Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --riso-pink: #ff48b0;
      --riso-blue: #0078bf;
      --riso-yellow: #ffe800;
      --riso-orange: #ff6c2f;
      --riso-black: #1a1a1a;
      --riso-paper: #f5f0e8;
      --riso-paper-dark: #ece5d8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--riso-paper);
      color: var(--riso-black);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
    }

    header {
      padding: 1.5rem 2rem 1rem;
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    .back {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      color: #999;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      flex-shrink: 0;
    }

    .back:hover {
      color: var(--riso-blue);
      border-color: var(--riso-blue);
    }

    .demo-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .demo-num {
      font-family: 'Space Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--riso-pink);
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .desc {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 2rem 1.25rem;
      font-size: 0.85rem;
      color: #777;
      line-height: 1.5;
    }

    .download-section {
      max-width: 860px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }

    .download-box {
      background: var(--riso-paper-dark);
      border: 1px solid #d8d0c4;
      border-radius: 6px;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .download-info {
      font-size: 0.85rem;
      color: #555;
      line-height: 1.6;
    }

    .download-info strong {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: var(--riso-black);
      margin-bottom: 0.35rem;
    }

    .download-info code {
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      background: rgba(0,0,0,0.06);
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }

    .download-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--riso-paper);
      background: var(--riso-blue);
      text-decoration: none;
      padding: 0.65rem 1.25rem;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .download-btn:hover {
      background: #005f99;
    }

    @media (max-width: 600px) {
      header { padding: 1.25rem 1.25rem 0.75rem; }
      .desc { padding: 0 1.25rem 1rem; }
      .download-section { padding: 1rem 1.25rem 2rem; }
      .download-box { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" class="back">&larr; All demos</a>
    <div class="demo-header">
      <span class="demo-num">00</span>
      <h1>Template</h1>
    </div>
  </header>
  <p class="desc">Boilerplate starter — half-letter at 150 DPI. Press "e" to export layers, "c" to toggle composite.</p>
  <div class="download-section">
    <div class="download-box">
      <div class="download-info">
        <strong>p5riso-template.zip</strong>
        Includes <code>sketch.js</code>, <code>p5.riso.js</code>, and a basic HTML wrapper to get started.
      </div>
      <a href="p5riso-template.zip" download class="download-btn">Download .zip</a>
    </div>
  </div>
</body>
</html>
